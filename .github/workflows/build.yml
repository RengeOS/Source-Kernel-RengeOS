name: Build Renge Kernels

on:
  workflow_dispatch:

concurrency:
  group: renge-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Init Arch Linux
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo github-cli

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Fix permissions
        run: chown -R builder:builder .

      - name: Build linux-renge-bore
        run: |
          su builder -c "
            cd linux-renge-bore
            export MAKEFLAGS='-j$(nproc)'
            makepkg -s --noconfirm
          "

      - name: Build linux-renge-lts
        run: |
          su builder -c "
            cd linux-renge-lts
            export MAKEFLAGS='-j$(nproc)'
            makepkg -s --noconfirm
          "

      - name: Collect packages
        run: |
          mkdir -p out
          find . -name '*.pkg.tar.zst' -exec mv {} out/ \;

      - name: Create result tag on current commit
        run: |
          TAG="workflow-result-${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$TAG"
          git push origin "$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: workflow-result-${{ github.run_number }}
          files: out/*.pkg.tar.zst

