name: Build Renge Bore Kernel

on:
  workflow_dispatch:

concurrency:
  group: renge-bore
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space (host)
        run: |
          rm -rf /usr/share/dotnet
          rm -rf /opt/ghc
          rm -rf /usr/local/lib/android
          rm -rf /usr/local/share/boost
          df -h

  build:
    needs: prepare
    runs-on: ubuntu-24.04

    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Init Arch
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo github-cli

      - uses: actions/checkout@v4

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Mount tmpfs
        run: |
          mkdir -p /buildtmp
          mount -t tmpfs -o size=10G tmpfs /buildtmp
          chown builder:builder /buildtmp

      - name: Build linux-renge-bore
        run: |
          su builder -c "
            cd linux-renge-bore
            makepkg -s --noconfirm --builddir /buildtmp
          "

      - name: Collect packages
        run: |
          mkdir -p out
          find . -name '*.pkg.tar.zst' -exec mv {} out/ \;

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bore-${{ github.run_number }}
          files: out/*.pkg.tar.zst
